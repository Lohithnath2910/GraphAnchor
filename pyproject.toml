[project]
name = "project-i"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "ollama>=0.6.2",
    "pydantic>=2.13.4",
    "pypdf>=6.17.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "ruff>=0.16.8",
    "spacy>=3.8.16",
    "tiktoken>=0.13.0",
    "uvicorn>=0.52.1",
]

[tool.pyright]
extraPaths = ["."]

[tool.ruff.lint]
ignore = ["BLE001", "S110", "B008"]
