services:
  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data            # graph database, vector store and embedding cache survive restarts
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy  # starts once both models are downloaded
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/bash", "-c"]
    # Start the server, wait until it answers, download the two models, then mark the container ready.
    command:
      - >-
        ollama serve &
        until ollama list >/dev/null 2>&1; do sleep 1; done;
        ollama pull llama3.2 && ollama pull snowflake-arctic-embed2:568m && touch /tmp/models-ready;
        wait
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/models-ready && ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 180                  # the first start downloads several GB
      start_period: 20s
    restart: unless-stopped
    # NVIDIA GPU (optional, needs the NVIDIA container toolkit): uncomment to use it.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  ollama_data:
